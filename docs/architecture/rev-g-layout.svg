<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="980" height="640" fill="#f7f6f3"/>
  <text x="24" y="32" font-size="18" fill="#1c1b19">Alloggiamenti e percorsi</text>
  <text x="24" y="52" font-size="12" fill="#5c5852">Vista dalla stanza. 320 × 400 × 30 mm. Percorsi di progetto, non una misura.</text>

  <!-- frame, origin top-left of the 320x400 outline at (40,70), scale 1.15 -->
  <g transform="translate(40,70) scale(1.15)">
    <rect x="0" y="0" width="320" height="400" fill="#fff" stroke="#1c1b19" stroke-width="1.6"/>
    <!-- panel -->
    <rect x="12" y="6" width="296" height="286" fill="#f3efe4" stroke="#1c1b19" stroke-width="1.2"/>
    <text x="160" y="150" text-anchor="middle" font-size="13" fill="#1c1b19">Pannello 296×286×8</text>
    <!-- exciters: screen centers LF (122,214) WB (198,92) in frame px where y down = 200-cad_y -->
    <circle cx="122" cy="214" r="23" fill="none" stroke="#9a3412" stroke-width="1.6"/>
    <text x="122" y="218" text-anchor="middle" font-size="10" fill="#9a3412">RMD</text>
    <rect x="167" y="67" width="61" height="51" fill="none" stroke="#9a3412" stroke-width="1.6"/>
    <text x="198" y="96" text-anchor="middle" font-size="10" fill="#9a3412">TEAX</text>
    <!-- sound arrows, out of the panel toward the viewer: drawn upward as the radiation leaves the face -->
    <g fill="none" stroke="#9a3412" stroke-width="1.3" marker-end="url(#s)">
      <path d="M122 190 V150"/>
      <path d="M198 67 V36"/>
    </g>
    <!-- bay -->
    <rect x="4" y="298" width="312" height="98" fill="#e7e5e4" stroke="#1c1b19" stroke-width="1.2"/>
    <rect x="8" y="303" width="88" height="88" fill="#fff" stroke="#1c1b19"/>
    <text x="52" y="348" text-anchor="middle" font-size="11" fill="#1c1b19">HAT</text>
    <rect x="102" y="332" width="66" height="31" fill="#fff" stroke="#1c1b19"/>
    <text x="135" y="351" text-anchor="middle" font-size="11" fill="#1c1b19">Core</text>
    <rect x="172" y="328" width="70" height="39" fill="#fff7ed" stroke="#9a3412"/>
    <text x="207" y="351" text-anchor="middle" font-size="11" fill="#9a3412">IRM-30</text>
    <rect x="246" y="307" width="60" height="80" fill="#fff" stroke="#1c1b19"/>
    <text x="276" y="350" text-anchor="middle" font-size="11" fill="#1c1b19">Amp</text>
    <!-- touch -->
    <rect x="8" y="378" width="32" height="16" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
    <rect x="280" y="378" width="32" height="16" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="24" y="374" text-anchor="middle" font-size="9" fill="#1d4ed8">Vol</text>
    <text x="296" y="374" text-anchor="middle" font-size="9" fill="#1d4ed8">Vol+</text>
    <!-- openings -->
    <rect x="44" y="324" width="16" height="46" fill="none" stroke="#57534e" stroke-dasharray="3 2"/>
    <g fill="#57534e">
      <rect x="20" y="301" width="6" height="3"/>
      <rect x="40" y="301" width="6" height="3"/>
      <rect x="60" y="301" width="6" height="3"/>
      <rect x="80" y="301" width="6" height="3"/>
    </g>
    <rect x="153" y="392" width="14" height="8" fill="none" stroke="#57534e" stroke-dasharray="3 2"/>
    <text x="160" y="388" text-anchor="middle" font-size="9" fill="#57534e">cavo</text>
  </g>

  <!-- thickness -->
  <g transform="translate(460,70)">
    <text x="0" y="0" font-size="14" fill="#1c1b19">Spessore, vano in basso</text>
    <g transform="translate(0,24) scale(8,1.05)">
      <rect x="0" y="0" width="30" height="98" fill="#e7e5e4" stroke="#1c1b19" stroke-width="0.4"/>
      <rect x="0" y="0" width="1" height="98" fill="#d6d3d1"/>
      <rect x="28.5" y="0" width="1.5" height="98" fill="#f3efe4"/>
      <rect x="1" y="20" width="23" height="39" fill="#fff7ed" stroke="#9a3412" stroke-width="0.35"/>
    </g>
    <g fill="none" stroke="#9a3412" stroke-width="1.4" marker-end="url(#s)">
      <path d="M20 150 H8"/>
      <path d="M250 150 H270"/>
    </g>
    <text x="8" y="144" font-size="11" fill="#9a3412">retro</text>
    <text x="250" y="144" font-size="11" fill="#9a3412">tela</text>
    <text x="0" y="250" font-size="12" fill="#1c1b19">Il modulo è contro la pelle da 1 mm.</text>
    <text x="0" y="268" font-size="12" fill="#5c5852">Il calore esce per conduzione, non per un camino.</text>
    <text x="0" y="300" font-size="14" fill="#1c1b19">Suono</text>
    <text x="0" y="318" font-size="12" fill="#5c5852">I motori spingono il pannello. Londa esce dalla tela.</text>
    <text x="0" y="336" font-size="12" fill="#5c5852">La cavità dietro è chiusa e profonda 19,5 mm: non è un reflex.</text>
    <text x="0" y="368" font-size="14" fill="#1c1b19">Aria</text>
    <text x="0" y="386" font-size="12" fill="#5c5852">Nessuna presa daria. Passano tela, feritoie microfono,</text>
    <text x="0" y="404" font-size="12" fill="#5c5852">finestra radar e il foro del cavo.</text>
  </g>
  <defs>
    <marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#9a3412"/>
    </marker>
  </defs>
  <g font-size="12" fill="#1c1b19">
    <rect x="40" y="560" width="14" height="8" fill="none" stroke="#9a3412"/>
    <text x="60" y="568">calore e suono</text>
    <rect x="180" y="560" width="14" height="8" fill="none" stroke="#1d4ed8"/>
    <text x="200" y="568">tocco</text>
    <rect x="280" y="560" width="14" height="8" fill="none" stroke="#57534e" stroke-dasharray="3 2"/>
    <text x="300" y="568">aria, solo fessure</text>
  </g>
</svg>
